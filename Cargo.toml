[package]
name = "codemd"
version = "0.2.0"
edition = "2024"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/AstraBert/codemd"
description = "CLI tool to extract code from markdown files."
keywords = ["markdown", "code", "codegen", "cli"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
regex = "1.12.2"
richrs = { version = "0.2.1", features = ["full"] }
